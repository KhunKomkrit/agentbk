[project]
name = "agentbk-01"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "Pillow>=10.0.0",
    "mcp>=1.3.0",
    "edge-tts>=7.2.8",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "httpx>=0.27",
    "openai-whisper>=20231117",
    "sounddevice>=0.4.6",
    "pyobjc-framework-avfoundation>=12.1",
    "pyperclip>=1.11.0",
]

[project.scripts]
agentbk = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
